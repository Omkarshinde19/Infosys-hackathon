# Lint + unit tests (Python, frontend), then the whole stack in Docker with the
# end-to-end tests: the Phase 6 loop over Redpanda/TimescaleDB and the Playwright demo flow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # a newer push makes the older run pointless

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up --build --detach --wait
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - name: Install test dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Engine -> Redpanda -> stream + TimescaleDB
        run: NETHEAL_E2E=1 pytest -q -s tests/e2e/test_stack.py
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Playwright demo flow
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Service logs
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
