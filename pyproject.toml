[project]
name = "netheal"
version = "0.1.0"
description = "Self-healing network simulator (Infosys Hack-AI-Thon NC-04)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "networkx>=3.7",
    "numpy>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.9",
    "openai>=2.0",
    "python-dotenv>=1.0",
    "aiokafka>=0.14",
    "asyncpg>=0.31",
    "redis>=8.1",
    "torch>=2.14",
    "torch-geometric>=2.8",
    "regopy>=1.5",
    "pyjwt>=2.15",
    "prometheus-client>=0.26",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-aiokafka>=0.66b0",
    "stable-baselines3>=2.9",
    "gymnasium>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pytest-timeout>=2.4", "httpx2>=2.13", "ruff>=0.16"]
train = ["mlflow>=3.16", "shap>=0.52", "matplotlib>=3.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "services"]

[tool.ruff]
line-length = 100
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
timeout = 120  # a hung loop fails the test instead of stalling the suite
