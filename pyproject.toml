[project]
name = "netheal"
version = "0.1.0"
description = "Self-healing network simulator (Infosys Hack-AI-Thon NC-04)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "networkx>=3.7",
    "numpy>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.9",
    "openai>=2.0",
    "python-dotenv>=1.0",
    "aiokafka>=0.14",
    "asyncpg>=0.31",
    "redis>=8.1",
    "torch>=2.14",
    "torch-geometric>=2.8",
    "regopy>=1.5",
    "pyjwt>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx2>=2.13", "ruff>=0.16"]
train = ["mlflow>=3.16", "shap>=0.52", "matplotlib>=3.10"]

[tool.setuptools]
packages = [
    "contracts", "services", "services.netsim", "services.gateway", "services.detector", "services.rca",
    "services.healer", "services.llm",
    "services.sink", "services.stream", "services.ml",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
